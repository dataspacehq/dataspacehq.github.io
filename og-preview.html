<!doctype html><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05090e;overflow:hidden}
  .card{position:relative;width:100vw;height:100vh;overflow:hidden;
        font-family:Geist,-apple-system,system-ui,sans-serif;
        background:radial-gradient(1100px 620px at 78% 8%, #16344a 0%, #0c1622 55%, #080d14 100%);
        color:#eaf2f8;display:flex;align-items:center}
  .frame{position:absolute;inset:22px;border:1px solid rgba(120,170,200,.16);border-radius:18px}
  .wrap{padding:0 5.2vw;width:100%;position:relative;z-index:2}
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:54px}
  .mark{width:2.9vw;height:2.9vw;border-radius:11px;background:linear-gradient(145deg,#5eb8e8,#7d8ff0)}
  .brand b{font-size:2.45vw;font-weight:800;letter-spacing:-.6px}
  .eyebrow{font-size:1.06vw;font-weight:700;letter-spacing:.22em;color:#54b6e0;margin-bottom:20px}
  h1{font-size:4.0vw;line-height:1.1;font-weight:900;letter-spacing:-1.6px;max-width:19ch}
  h1 .hl{color:#5ec3ea}
  .sub{margin-top:24px;font-size:1.52vw;line-height:1.45;color:#9db4c6;max-width:30ch}
  .foot{position:absolute;left:5.2vw;right:5.2vw;bottom:6.3vh;display:flex;
        justify-content:space-between;align-items:center;font-size:19px}
  .foot{font-size:1.26vw} .foot b{font-weight:700} .foot span{color:#7d94a6}
</style>
<div class="card">
  <div class="frame"></div>
  <div class="wrap">
    <div class="brand"><div class="mark"></div><b>DataSpaceHQ</b></div>
    <div class="eyebrow">SNOWFLAKE NATIVE APP</div>
    <h1>A renamed column broke it. <span class="hl">Nothing was watching.</span></h1>
    <div class="sub">Governed data domains on Snowflake — inside rules you set once.</div>
  </div>
  <div class="foot"><b>dataspacehq.com</b><span>Runs inside your own account</span></div>
</div>
